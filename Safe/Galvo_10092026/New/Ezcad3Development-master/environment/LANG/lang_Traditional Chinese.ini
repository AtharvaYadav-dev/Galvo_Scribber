INFO_EAN13 =	EAN-13是固定長度的條碼,它的字符集只包含'0'-'9'的數字,EAN-13包含13個字符，前12個為數據，最後1個字符為校驗碼，校驗碼由系統自動加入，系統只取前12個字符。
INFO_EAN13_2 =	 EAN-13+2是EAN-13加上2位附加碼,系統取最後2個字符作為附加碼。
INFO_EAN13_5 =	 EAN-13+5是EAN-13加上5位附加碼,系統取最後5個字符作為附加碼。
INFO_EAN8 =	 EAN-8是固定長度的條碼,它的字符集只包含'0'-'9'的數字,EAN-8包含8個字符，前7個為數據，最後1個字符為校驗碼，校驗碼由系統自動加入，系統只取前7個字符。
INFO_EAN8_2 =	 EAN-8+2是EAN-8加上2位附加碼,系統取最後2個字符作為附加碼。
INFO_EAN8_5 =	 EAN-8+5是EAN-8加上5位附加碼,系統取最後5個字符作為附加碼。
	
