[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gerbyx"
version = "0.3.0"
description = "Gerber parser that generates Shapely objects for PCB and geometries"
readme = "README.md"
authors = [
  {name = "The Ant Team", email = "compact.pcb.maker.team@gmail.com"}
]
maintainers = [
  {name = "The Ant Team", email = "compact.pcb.maker.team@gmail.com"}
]
classifiers = [
    # TODO
]
license-files = ["LICENSE"]
dependencies = [
    "typer",
    "Shapely",
    "rich",
]
requires-python = ">= 3.10"

[project.optional-dependencies]
plot = [
    "matplotlib",
]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
]

[project.urls]
bugs = "https://github.com/TheAntTeam/gerbyx/issues"
changelog = "https://github.com/TheAntTeam/gerbyx/blob/master/HISTORY.md"
homepage = "https://github.com/TheAntTeam/gerbyx"

[project.scripts]
gerbyx = "gerbyx.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["gerbyx*"]

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
